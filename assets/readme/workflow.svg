<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="336" viewBox="0 0 1200 336"
     role="img" aria-labelledby="title desc">
  <title id="title">How skimmable works</title>
  <desc id="desc">Pipeline diagram: the SessionStart hook injects the ruleset, the UserPromptSubmit hook re-reinforces it every turn and handles the toggle, and every reply comes out formatted.</desc>

  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
  </defs>

  <rect width="1200" height="336" rx="26" fill="#0D1117"/>

  <!-- ── Title ────────────────────────────────────────────────── -->
  <g id="title-block" transform="translate(64 0)">
    <text class="sans" x="0" y="72" font-size="42" font-weight="700" fill="#F0F6FC">How it works</text>
    <text class="sans" x="0" y="106" font-size="20" fill="#8B949E">Two hooks keep the style on every reply — no config needed.</text>
  </g>

  <!-- ── Pipeline ─────────────────────────────────────────────── -->
  <g id="pipeline" transform="translate(64 160)">
    <g id="stage-1">
      <rect width="300" height="152" rx="14" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
      <text class="mono" x="20" y="34" font-size="18" fill="#D97757">SessionStart</text>
      <g class="sans" font-size="18" fill="#C9D1D9">
        <text x="20" y="66">Injects the ruleset from</text>
        <text x="20" y="91">skills/skimmable/SKILL.md</text>
        <text x="20" y="116">as hidden system context</text>
        <text x="20" y="141">before the first prompt.</text>
      </g>
    </g>

    <polygon points="335,66 347,76 335,86" fill="none" stroke="#D97757" stroke-width="2.5" stroke-linejoin="round"/>

    <g id="stage-2" transform="translate(386 0)">
      <rect width="300" height="152" rx="14" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
      <text class="mono" x="20" y="34" font-size="18" fill="#D97757">UserPromptSubmit</text>
      <g class="sans" font-size="18" fill="#C9D1D9">
        <text x="20" y="66">Re-reinforces the style</text>
        <text x="20" y="91">every turn, survives</text>
        <text x="20" y="116">compaction, handles the</text>
        <text x="20" y="141">natural-language toggle.</text>
      </g>
    </g>

    <polygon points="721,66 733,76 721,86" fill="none" stroke="#D97757" stroke-width="2.5" stroke-linejoin="round"/>

    <g id="stage-3" transform="translate(772 0)">
      <rect width="300" height="152" rx="14" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
      <text class="mono" x="20" y="34" font-size="18" fill="#D97757">Every reply</text>
      <g class="sans" font-size="18" fill="#C9D1D9">
        <text x="20" y="66">Every reply: short</text>
        <text x="20" y="91">sentences, lists over</text>
        <text x="20" y="116">paragraphs, code blocks</text>
        <text x="20" y="141">for illustration.</text>
      </g>
    </g>
  </g>
</svg>
